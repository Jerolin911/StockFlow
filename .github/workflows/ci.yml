name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: End-to-end tests (in-memory API + Vite)
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker stack end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DATA_ENCRYPTION_KEYS: ci:Y2ktb25seS1lbmNyeXB0aW9uLWtleS1ub3Qtc2VjcnQ=
      BLIND_INDEX_KEY: Y2ktb25seS1ibGluZC1pbmRleC1rZXktbm90LXNlY3I=
      SEED_PASSWORD: e2e-demo-password
      LOGIN_RATE_LIMIT: '1000'
      WEB_PORT: '8080'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and start the production images
        run: docker compose up -d --build --wait

      - name: Load demo data
        run: docker compose run --rm seed

      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/api/v1/docs/
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d "{\"email\":\"admin@stockflow.test\",\"password\":\"$SEED_PASSWORD\"}" | grep -q accessToken

      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: End-to-end tests against the Docker stack
        run: npx playwright test
        working-directory: apps/web
        env:
          CI: true
          E2E_BASE_URL: http://localhost:8080

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-docker
          path: apps/web/playwright-report
          retention-days: 7

  publish:
    name: Publish images to GHCR
    needs: [verify, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stockflow-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
